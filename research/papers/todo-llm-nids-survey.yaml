schema_version: 1
id: todo-llm-nids-survey
short_name: "LLM for NIDS Survey"
title: "Large Language Models for Network Intrusion Detection Systems: Foundations, Implementations, and Future Directions"
authors:
  - Shuo Yang
  - Xinran Zheng
  - Xinchen Zhang
  - Jinfeng Xu
  - Jinze Li
  - Donglin Xie
  - Weicai Long
  - Edith C.H. Ngai
year: 2025
venue: "IEEE (submitted)"
extraction_basis: full-text
problem: threat-hunting
input_modalities: [text, logs, network]
threat_intel_standards: [MITRE ATT&CK, CVE]

related: []

architecture:
  paradigm: hybrid
  components:
    - name: LLM-enhanced Processor
      role: "traffic generation, data processing, feature extraction"
      inputs: [raw network data]
      outputs: [processed features]
      implementation: "LLMs for generation, cleaning, embedding"
    - name: LLM-based Detector
      role: "detect intrusions using non-tuned or tuned LLMs"
      inputs: [processed data]
      outputs: [detection alert]
      implementation: "zero-shot, ICL, CoT, RAG, fine-tuning"
    - name: LLM-driven Explainer
      role: "provide decision, strategy, and report-level explanations"
      inputs: [detection, context]
      outputs: [explanation, report]
      implementation: "LLM generation"
    - name: LLM-centered Controller
      role: "orchestrate workflow across tools and components"
      inputs: [workflow state]
      outputs: [coordinated actions]
      implementation: "LLM as orchestrator"
  orchestration: "pipeline: data collection → processing → detection → analysis → response; LLM as controller"
  memory:
    type: vector
    details: "RAG with external knowledge (MITRE ATT&CK, CVE, CTI)"
  tools: ["Wireshark", "SIEM", "MITRE ATT&CK", "CVE", "CTI"]
  models:
    - name: "GPT-4"
      role: "surveyed"
      access: unknown
    - name: "LLaMA2"
      role: "surveyed"
      access: unknown
    - name: "DeepSeek"
      role: "surveyed"
      access: unknown
    - name: "Mistral"
      role: "surveyed"
      access: unknown
    - name: "Zephyr"
      role: "surveyed"
      access: unknown

evaluation:
  datasets: ["KDD99", "CICIDS2017", "UNSW-NB15", "ISXW2016", "ToN IoT", etc.]
  metrics: ["Accuracy", "F1", "etc."]
  baselines: ["traditional NIDS", "ML/DL methods"]
  reported_results: "Survey of implementations; LLMs enhance detection, explainability, and orchestration"
  reproducible: "unknown"

limitations:
  - "Survey only"
  - "Challenges: validity (hallucination), complexity (compute), privacy"

review:
  added_by: "@user"
  date: "2026-10-04"
