schema_version: 1
id: todo-vuln-detect-survey
short_name: "LLM Vulnerability Detection Survey"
title: "LLMs in Software Security: A Survey of Vulnerability Detection Techniques and Insights"
authors:
  - Ze Sheng
  - Zhicheng Chen
  - Shuning Gu
  - Heqing Huang
  - Guofei Gu
  - Jeff Huang
year: 2025
venue: "ACM Computing Surveys (submitted)"

extraction_basis: full-text
problem: detection-engineering
input_modalities: [text, code]
threat_intel_standards: [CWE, CVE]

related: []

architecture:
  paradigm: hybrid
  components:
    - name: Code Data Preprocessing
      role: "AST, CFG, DFG, RAG, LLVM IR to structure code for LLM context"
      inputs: [source code]
      outputs: [structured code representation]
      implementation: "graph representations, retrieval, slicing"
    - name: Prompt Engineering
      role: "CoT, few-shot, hierarchical context, multi-level prompting, multi-agent templates"
      inputs: [structured code, task]
      outputs: [vulnerability prediction or explanation]
      implementation: "prompt design"
    - name: Fine-tuning
      role: "full fine-tuning, PEFT (LoRA, adapters), discriminative, generative"
      inputs: [code, labels]
      outputs: [fine-tuned model]
      implementation: "SFT, RL, DAPT"
  orchestration: "varies; often pipeline of preprocessing → prompting/fine-tuning → detection"
  memory:
    type: none
    details: "mostly static context; some RAG"
  tools: ["static analysis tools", "RAG", "code execution"]
  models:
    - name: "GPT-4"
      role: "reasoning"
      access: unknown
    - name: "CodeLlama"
      role: "coding"
      access: unknown
    - name: "BERT"
      role: "encoder"
      access: unknown
    - name: "CodeBERT"
      role: "encoder"
      access: unknown
    - name: "StarCoder"
      role: "coding"
      access: unknown

evaluation:
  datasets: ["BigVul", "CVEFixes", "Devign", "Juliet", "DiverseVul", "SARD", etc.]
  metrics: ["Accuracy", "Precision", "Recall", "F1", "MCC", "BLEU", "ROUGE"]
  baselines: ["static analysis", "traditional ML", "encoder-only models"]
  reported_results: "Survey of 58 studies; C/C++ dominates; decoder-only models 67.1% of usage"
  reproducible: "unknown"

limitations:
  - "Survey only; no new method"
  - "Dataset limitations: data leakage, narrow scope"
  - "Lack of repository-level evaluation"

review:
  added_by: "@user"
  date: "2026-10-04"
