schema_version: 1
id: todo-org-scoped-runtime
short_name: "Org-Scoped LLM Runtime"
title: "Organization-Scoped LLM Agent Runtime for Financial Cybersecurity"
authors:
  - George Fatouros
  - Georgios Makridis
  - George Kousiouris
  - John Soldatos
  - Dimosthenis Kyriazis
year: 2026
venue: "arXiv preprint"
extraction_basis: full-text
problem: incident-response
input_modalities: [text, logs, network]
threat_intel_standards: [MITRE ATT&CK, CVE, DORA, NIS2, GDPR, PSD2, AI Act]

related: []

architecture:
  paradigm: agentic
  components:
    - name: Security Context
      role: "typed object created at every entry point; enforced at every component boundary"
      inputs: [entry point]
      outputs: [scoped context]
      implementation: "runtime contract with org_id, user_id, role, data_scope, etc."
    - name: Runtime Core
      role: "stable platform boundary: API/UI backend, event router, scheduler, workflow orchestrator, Security Context service, Model Gateway, Context Broker, Tool Adapter Layer, state, memory, audit, observability"
      inputs: [requests, events]
      outputs: [coordinated actions]
      implementation: "shared runtime process"
    - name: Main Agent
      role: "analyst-facing coordinator; dispatches specialists, sequences findings, routes to HITL"
      inputs: [Security Context]
      outputs: [actions, findings]
      implementation: "LLM-based agent"
    - name: Specialist Subagents
      role: "Threat Intelligence, Compliance Verification, Incident Response, Reporting"
      inputs: [subtask, Security Context]
      outputs: [findings]
      implementation: "logical actors with role instructions"
    - name: Tool Adapter Layer
      role: "native typed adapters, CLI wrappers, MCP connectors; all subject to Security Context"
      inputs: [tool call]
      outputs: [result]
      implementation: "governed adapters with schema validation"
    - name: Context Broker
      role: "mediates document RAG, graph RAG, structured stores, scoped memory, live context"
      inputs: [query, Security Context]
      outputs: [retrieved context]
      implementation: "retrieval services"
  orchestration: "event-driven and query-driven workflows; HITL tiers (1-3); append-only audit"
  memory:
    type: hybrid
    details: "scoped agent memory and approved institutional memory; vector and graph stores"
  tools: ["SIEM/XDR query", "enrichment", "response primitives", "CTI feeds", "MITRE ATT&CK", "CVE"]
  models:
    - name: "local models"
      role: "surveyed"
      access: unknown
    - name: "private API endpoints"
      role: "surveyed"
      access: unknown
    - name: "Model Gateway abstracts providers"
      role: "surveyed"
      access: unknown

evaluation:
  datasets: ["synthetic DORA-shaped incident emails", "sample SIEM alerts", "anonymised CVE list"]
  metrics: ["architecture readiness", "security & governance", "output quality", "operational"]
  baselines: []
  reported_results: "Proposed architecture with falsifiable evaluation plan; not yet empirically validated"
  reproducible: "partial"

limitations:
  - "Architectural proposal; no production validation"
  - "Evaluation plan not executed"
  - "Several capabilities treated as extension paths"

review:
  added_by: "@user"
  date: "2026-10-04"
