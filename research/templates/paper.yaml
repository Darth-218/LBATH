# Copy to research/papers/<id>.yaml. The filename stem must equal `id`;
# for doi-… and url-… ids, replace `/` with `_` in the stem.
# Ids take one of four prefixes — arxiv-, doi-, url-, or the temporary
# todo- placeholder (validate.py warns on it). See CONVENTIONS.md §IDs.
# Run `python research/scripts/validate.py` before opening a PR.
# Replace every TODO before committing.
